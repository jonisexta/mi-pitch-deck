{
  "cleanUrls": true,
  "rewrites": [
    { "source": "/brands/acqua-vitali", "destination": "/brands/acqua-vitali/index.html" },
    { "source": "/brands/acqua-vitali/", "destination": "/brands/acqua-vitali/index.html" }
  ],
  "headers": [
    {
      "source": "/(.*)",
      "headers": [
        { "key": "Cache-Control", "value": "public, max-age=0, must-revalidate" }
      ]
    }
  ]
}
