:root {
  --bg-color: #050b13;
  --bg-soft: #0b1622;
  --surface: rgba(132, 223, 255, 0.07);
  --surface-strong: rgba(132, 223, 255, 0.12);
  --surface-border: rgba(132, 223, 255, 0.16);
  --text-color: #f2fbff;
  --text-muted: rgba(242, 251, 255, 0.74);
  --accent: #77e7ff;
  --accent-2: #1895ff;
  --success: #72e7c4;
  --max-width: 1220px;
  --title-line-height: 0.92;
}

body {
  background:
    radial-gradient(circle at 10% 15%, rgba(119, 231, 255, 0.12), transparent 24%),
    radial-gradient(circle at 90% 20%, rgba(24, 149, 255, 0.12), transparent 26%),
    linear-gradient(180deg, #07111c 0%, #050b13 45%, #04080f 100%);
}

.hero {
  overflow: hidden;
}
.hero::before,
.hero::after {
  content: '';
  position: absolute;
  inset: auto;
  width: 420px;
  height: 420px;
  filter: blur(60px);
  border-radius: 50%;
  z-index: -1;
}
.hero::before {
  top: -80px;
  left: -100px;
  background: rgba(119, 231, 255, 0.18);
}
.hero::after {
  right: -80px;
  bottom: -60px;
  background: rgba(24, 149, 255, 0.18);
}
.hero__layout {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: clamp(28px, 5vw, 70px);
  align-items: center;
}
.hero__content {
  display: grid;
  gap: 22px;
}
.hero__content h1 span {
  color: var(--accent);
}
.hero__stats {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.hero__stat {
  padding: 12px 16px;
  border-radius: 999px;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--surface-border);
  color: var(--text-muted);
}
.hero__visual {
  display: grid;
  gap: 20px;
}
.hero__badge {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  width: fit-content;
  padding: 14px 18px;
  border-radius: 18px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--surface-border);
}
.hero__badge strong { color: var(--text-color); }
.hero__panel {
  overflow: hidden;
}
.hero__panel img {
  aspect-ratio: 16 / 10;
  object-fit: cover;
}
.section-title {
  display: grid;
  gap: 16px;
  max-width: 760px;
}
.segment-shell {
  display: grid;
  gap: 22px;
}
.segment-pin {
  display: grid;
  gap: 30px;
}
.segment-body {
  min-height: 440px;
  display: grid;
  align-items: center;
}
.segment-copy {
  display: grid;
  gap: 18px;
}
.segment-copy ul {
  margin: 0;
  padding-left: 18px;
  color: var(--text-muted);
  display: grid;
  gap: 10px;
}
.segment-copy li::marker { color: var(--accent); }
.solution-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}
.solution-card {
  padding: 24px;
  min-height: 220px;
}
.solution-card__metric {
  display: inline-flex;
  margin-top: 24px;
  padding: 10px 14px;
  border-radius: 999px;
  background: rgba(119, 231, 255, .12);
  color: var(--accent);
  font-weight: 700;
}
.closing {
  text-align: center;
}
.closing__panel {
  min-height: 72vh;
  display: grid;
  place-items: center;
  gap: 24px;
  padding: 40px;
}
.closing__copy {
  display: grid;
  gap: 16px;
  max-width: 720px;
}
.closing__copy p {
  margin-inline: auto;
}
.canvas-wrap {
  position: relative;
  min-height: 420px;
}
.chart-wrap canvas {
  width: 100% !important;
  height: 380px !important;
}
.footer-mini {
  padding: 24px 0 40px;
  text-align: center;
  color: var(--text-muted);
}

@media (max-width: 980px) {
  .hero__layout,
  .solution-grid {
    grid-template-columns: 1fr;
  }
}
